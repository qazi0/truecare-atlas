[project]
name = "trustmap-india-backend"
version = "0.1.0"
description = "TrustMap India — FastAPI backend for agentic healthcare intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "sse-starlette>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "databricks-sdk>=0.40.0",
    "databricks-openai>=0.3.0",
    "mlflow>=2.20.0",
    "databricks-sql-connector>=3.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
