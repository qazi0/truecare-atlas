resources:
  apps:
    trustmap_india:
      name: trustmap-india
      source_code_path: ../backend
      config:
        command:
          - python
          - -m
          - app.main
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            valueFrom: sql-warehouse
          - name: TM_WAREHOUSE_ID
            valueFrom: sql-warehouse
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: "7180e1001ad3c807"
            permission: CAN_USE
        - name: serving-endpoint
          serving_endpoint:
            name: databricks-gpt-5-5
            permission: CAN_QUERY
        - name: vector-search-endpoint
          serving_endpoint:
            name: tm_endpoint
            permission: CAN_QUERY
      permissions:
        - user_name: fullbridgerectifier@gmail.com
          level: CAN_MANAGE
